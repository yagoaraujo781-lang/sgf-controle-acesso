<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SGF - Controle de Acesso</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>SGF</h1>

        <h2>Controle de Acesso em Canteiros</h2>

        <div class="card">

            <h3>Check-in na Portaria</h3>

            <label>Código do crachá:</label>

            <input
                type="text"
                id="codigo"
                placeholder="Ex: FUNC001"
            >

            <button onclick="verificarAcesso()">
                Verificar Acesso
            </button>

            <div id="resultado"></div>

        </div>


        <div class="card">

            <h3>Histórico de Acessos</h3>

            <div id="historico">

                <p>Nenhum acesso realizado ainda.</p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
